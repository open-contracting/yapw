name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install .[test]
      # Python 3.10 issues "DeprecationWarning: There is no current event loop" spuriously
      - if: matrix.python-version == '3.10'
        name: Test
        env:
          TEST_RABBIT_URL: amqp://127.0.0.1:${{ job.services.rabbitmq.ports[5672] }}
        shell: bash
        run: |
          coverage run --source=yapw --append -m pytest
          pip install orjson
          coverage run --source=yapw --append -m pytest
          pip uninstall -y orjson
      - if: matrix.python-version != '3.10'
        name: Test
        env:
          TEST_RABBIT_URL: amqp://127.0.0.1:${{ job.services.rabbitmq.ports[5672] }}
        shell: bash
        run: |
          coverage run --source=yapw --append -m pytest -W error -W ignore::ResourceWarning
          pip install orjson
          coverage run --source=yapw --append -m pytest -W error -W ignore::ResourceWarning
          pip uninstall -y orjson
      - uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          fail_ci_if_error: true
    services:
      rabbitmq:
        image: rabbitmq:latest
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5672/tcp
  # Without `if: always()`, a failed `test` would skip `build`, and a skipped job satisfies a required status check.
  build:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
